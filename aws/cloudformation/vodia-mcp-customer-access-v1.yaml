AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Vodia MCP customer AWS connection. Creates the cross-account deployment role
  trusted by the Vodia-hosted MCP and the EC2 instance role used for AWS
  Marketplace entitlements. Review all permissions before creating the stack.

Parameters:
  ProviderRoleArn:
    Type: String
    Description: AWS IAM role ARN operated by the Vodia-hosted MCP.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    ConstraintDescription: Must be a valid AWS IAM role ARN.
  ExternalId:
    Type: String
    Description: Customer-specific External ID generated by Vodia MCP.
    MinLength: 8
    MaxLength: 1224
    AllowedPattern: '^[A-Za-z0-9+=,.@:/_-]+$'
    ConstraintDescription: Must use AWS STS ExternalId-compatible characters.
  MarketplaceProductId:
    Type: String
    Default: prod-v5qnz6xf6wu5u
    Description: Vodia AWS Marketplace product identifier.

Resources:
  VodiaMCPDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VodiaMCPDeploymentRole
      Description: Cross-account role used by the Vodia-hosted MCP for approved AWS Marketplace and EC2 deployment operations.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustVodiaMCP
            Effect: Allow
            Principal:
              AWS: !Ref ProviderRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: VodiaMCPDeploymentRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MarketplaceRead
                Effect: Allow
                Action:
                  - aws-marketplace:SearchListings
                  - aws-marketplace:GetProduct
                  - aws-marketplace:ListFulfillmentOptions
                  - aws-marketplace:ListPurchaseOptions
                  - aws-marketplace:GetOffer
                  - aws-marketplace:GetOfferTerms
                  - aws-marketplace:SearchAgreements
                  - aws-marketplace:DescribeAgreement
                  - aws-marketplace:GetAgreementTerms
                  - aws-marketplace:GetAgreementEntitlements
                  - aws-marketplace:ViewSubscriptions
                Resource: '*'
              - Sid: MarketplacePurchaseVodiaOnly
                Effect: Allow
                Action:
                  - aws-marketplace:CreateAgreementRequest
                  - aws-marketplace:AcceptAgreementRequest
                Resource: '*'
                Condition:
                  ForAnyValue:StringEquals:
                    aws-marketplace:ProductId:
                      - !Ref MarketplaceProductId
              - Sid: EC2ReadAndLaunch
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeKeyPairs
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInstanceTypes
                  - ec2:RunInstances
                  - ec2:CreateTags
                Resource: '*'
              - Sid: PassVodiaEntitlementRoleOnly
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/VodiaPBXMarketplaceEntitlementRole

  VodiaPBXMarketplaceEntitlementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: VodiaPBXMarketplaceEntitlementRole
      Description: EC2 instance role used by the Vodia PBX Marketplace instance to read its Marketplace entitlements.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: TrustEC2
            Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSMarketplaceGetEntitlements

  VodiaPBXMarketplaceEntitlementInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: VodiaPBXMarketplaceEntitlementRole
      Roles:
        - !Ref VodiaPBXMarketplaceEntitlementRole

Outputs:
  AwsAccountId:
    Description: Enter this 12-digit account ID back into Vodia Setup for automatic verification.
    Value: !Ref AWS::AccountId
  DeploymentRoleArn:
    Description: Cross-account role ARN that Vodia MCP will verify with STS AssumeRole.
    Value: !GetAtt VodiaMCPDeploymentRole.Arn
  EntitlementRoleName:
    Description: EC2 Marketplace entitlement role created for Vodia PBX instances.
    Value: !Ref VodiaPBXMarketplaceEntitlementRole
  ExternalId:
    Description: Customer-specific External ID used by the role trust policy.
    Value: !Ref ExternalId
