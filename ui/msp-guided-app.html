<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vodia MSP Setup</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:CanvasText}
.wrap{max-width:620px;margin:auto}.card{border:1px solid color-mix(in srgb,CanvasText 14%,transparent);border-radius:16px;padding:16px;background:Canvas;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:13px;opacity:.7;margin:0 0 16px}
.status{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0 16px}.dot{width:9px;height:9px;border-radius:50%;background:#999}.ok .dot{background:#22a06b}.bad .dot{background:#d1242f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
section{border:1px solid color-mix(in srgb,CanvasText 10%,transparent);border-radius:12px;padding:13px}h2{font-size:14px;margin:0 0 10px}
label{display:block;font-size:12px;opacity:.72;margin:8px 0 5px}input,select,button{width:100%;border-radius:10px;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);font:inherit}
input,select{padding:10px;background:Canvas;color:CanvasText}button{padding:10px 12px;margin-top:10px;background:#111;color:#fff;border-color:#111;cursor:pointer;font-weight:600}button.secondary{background:transparent;color:CanvasText}button:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:18px;font-size:12px;margin-top:8px;opacity:.8}.row{display:flex;gap:8px}.row button{width:auto;flex:1}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;background:color-mix(in srgb,CanvasText 8%,transparent);margin-left:6px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Vodia MSP Setup</h1>
    <p class="sub">Create and select organizations and customers without copying UUIDs.</p>
    <div id="authStatus" class="status"><span class="dot"></span><span>Connecting…</span></div>

    <div class="grid">
      <section>
        <h2>Organization</h2>
        <label for="orgSelect">Select organization</label>
        <select id="orgSelect"><option value="">Loading…</option></select>

        <label for="orgName">New organization</label>
        <input id="orgName" maxlength="160" placeholder="Example: Vodia Networks">
        <button id="createOrg">Create organization</button>
        <div id="orgMsg" class="msg"></div>
      </section>

      <section>
        <h2>Customer</h2>
        <label for="customerSelect">Select customer</label>
        <select id="customerSelect"><option value="">Loading…</option></select>

        <label for="customerName">New customer</label>
        <input id="customerName" maxlength="160" placeholder="Example: Acme Hotel">
        <button id="createCustomer">Create customer</button>
        <div id="customerMsg" class="msg"></div>
      </section>
    </div>

    <section style="margin-top:12px">
      <h2>AWS connection <span id="awsBadge" class="badge">Not checked</span></h2>
      <p class="sub" style="margin-bottom:8px">Choose a customer above, then check whether its AWS connection is configured.</p>
      <div class="row">
        <button id="checkAws" class="secondary">Check AWS</button>
        <button id="refresh" class="secondary">Refresh</button>
      </div>
      <div id="awsMsg" class="msg"></div>
    </section>
  </div>
</div>

<script>
(() => {
  let rpcId = 1;
  const pending = new Map();
  let initialized = false;

  function post(msg){ window.parent.postMessage(msg, "*"); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id && pending.has(m.id)) {
      const {resolve,reject} = pending.get(m.id);
      pending.delete(m.id);
      if (m.error) reject(new Error(m.error.message || "Host request failed"));
      else resolve(m.result);
    }
  });

  function request(method, params={}) {
    const id = rpcId++;
    post({jsonrpc:"2.0",id,method,params});
    return new Promise((resolve,reject)=>{
      pending.set(id,{resolve,reject});
      setTimeout(()=>{
        if(pending.has(id)){pending.delete(id);reject(new Error("Host request timed out"))}
      },15000);
    });
  }

  async function initBridge(){
    if (window.openai?.callTool) return;
    try {
      await request("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: {name:"vodia-msp-guided",version:"1.0.0"},
        appCapabilities: {}
      });
      post({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}});
      initialized = true;
    } catch (e) {
      // Some hosts expose the compatibility callTool surface instead of the standard bridge.
      if (!window.openai?.callTool) throw e;
    }
  }

  async function callTool(name,args={}){
    if (window.openai?.callTool) return window.openai.callTool(name,args);
    if (!initialized) await initBridge();
    return request("tools/call",{name,arguments:args});
  }

  function dataFrom(result){
    const sc=result?.structuredContent;
    if(sc?.data && typeof sc.data==="object") return sc.data;
    if(sc?.result && typeof sc.result==="object") return sc.result;
    if(sc && typeof sc==="object") return sc;
    const text=(result?.content||[]).find(x=>x?.type==="text")?.text;
    if(text){try{return JSON.parse(text)}catch{}}
    return result||{};
  }

  function setStatus(ok,text){
    const el=document.getElementById("authStatus");
    el.className="status "+(ok?"ok":"bad");
    el.querySelector("span:last-child").textContent=text;
  }
  function msg(id,text){document.getElementById(id).textContent=text||""}
  function customerId(){return document.getElementById("customerSelect").value}
  function orgId(){return document.getElementById("orgSelect").value}

  async function refreshIdentity(){
    const r=dataFrom(await callTool("msp_get_my_identity",{}));
    const ident=r.identity||{};
    setStatus(Boolean(ident.authenticated), ident.authenticated ? "OAuth connected" : "OAuth required");
  }

  async function refreshOrganizations(preselect){
    const r=dataFrom(await callTool("msp_list_organizations",{}));
    const rows=r.organizations||[];
    const sel=document.getElementById("orgSelect");
    sel.innerHTML='<option value="">Select…</option>';
    rows.forEach(o=>{
      const op=document.createElement("option");
      op.value=o.id; op.textContent=o.name + (Number(o.customerCount) ? " ("+o.customerCount+")" : "");
      sel.appendChild(op);
    });
    if(preselect) sel.value=preselect;
    if(!sel.value && rows.length===1) sel.value=rows[0].id;
    document.getElementById("createCustomer").disabled=!sel.value;
  }

  async function refreshCustomers(preselect){
    const r=dataFrom(await callTool("msp_list_customers",{}));
    const rows=r.customers||[];
    const sel=document.getElementById("customerSelect");
    const keep=preselect||sel.value;
    sel.innerHTML='<option value="">Select…</option>';
    rows.forEach(c=>{
      const op=document.createElement("option");
      op.value=c.id; op.dataset.org=c.organizationId||"";
      op.textContent=c.name+" — "+(c.organizationName||"");
      sel.appendChild(op);
    });
    if(keep) sel.value=keep;
    document.getElementById("checkAws").disabled=!sel.value;
  }

  async function refreshAll(){
    msg("orgMsg","");msg("customerMsg","");msg("awsMsg","");
    await refreshIdentity();
    await Promise.all([refreshOrganizations(),refreshCustomers()]);
  }

  document.getElementById("orgSelect").addEventListener("change",()=>{
    document.getElementById("createCustomer").disabled=!orgId();
  });
  document.getElementById("customerSelect").addEventListener("change",()=>{
    document.getElementById("checkAws").disabled=!customerId();
    document.getElementById("awsBadge").textContent="Not checked";
  });

  document.getElementById("createOrg").addEventListener("click",async()=>{
    const name=document.getElementById("orgName").value.trim();
    if(name.length<2){msg("orgMsg","Enter an organization name.");return}
    try{
      msg("orgMsg","Creating…");
      const r=dataFrom(await callTool("msp_create_organization",{name}));
      const id=r.organization?.id;
      document.getElementById("orgName").value="";
      await refreshOrganizations(id);
      msg("orgMsg","Created "+(r.organization?.name||name)+".");
    }catch(e){msg("orgMsg",e.message)}
  });

  document.getElementById("createCustomer").addEventListener("click",async()=>{
    const organizationId=orgId();
    const name=document.getElementById("customerName").value.trim();
    if(!organizationId){msg("customerMsg","Select an organization.");return}
    if(name.length<2){msg("customerMsg","Enter a customer name.");return}
    try{
      msg("customerMsg","Creating…");
      const r=dataFrom(await callTool("msp_create_customer",{organizationId,name}));
      const id=r.customer?.id;
      document.getElementById("customerName").value="";
      await Promise.all([refreshOrganizations(organizationId),refreshCustomers(id)]);
      msg("customerMsg","Created "+(r.customer?.name||name)+".");
    }catch(e){msg("customerMsg",e.message)}
  });

  document.getElementById("checkAws").addEventListener("click",async()=>{
    const customerId=customerId();
    if(!customerId){msg("awsMsg","Select a customer.");return}
    try{
      msg("awsMsg","Checking…");
      const r=dataFrom(await callTool("msp_get_customer_aws_connection",{customerId}));
      const c=r.connection;
      document.getElementById("awsBadge").textContent=c?.configured?"Configured":"Not configured";
      msg("awsMsg",c?.configured ? ("AWS account "+(c.account||"connected")+" is ready.") : "No AWS connection saved for this customer.");
    }catch(e){msg("awsMsg",e.message)}
  });

  document.getElementById("refresh").addEventListener("click",()=>refreshAll().catch(e=>setStatus(false,e.message)));

  (async()=>{
    try{await initBridge();await refreshAll()}
    catch(e){setStatus(false,e.message)}
  })();
})();
</script>
</body>
</html>
