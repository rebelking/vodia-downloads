<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vodia Setup</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:auto;min-height:0;background:transparent;color:CanvasText;overflow:visible}
body{padding:10px}
body.fullscreen{height:100vh;overflow-y:auto}
.wrap{width:100%;max-width:760px;margin:auto}
body.fullscreen .wrap{max-width:860px}
.card{width:100%;border:1px solid color-mix(in srgb,CanvasText 14%,transparent);border-radius:12px;padding:15px;background:Canvas}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font-size:19px;line-height:1.2;margin:0 0 3px}
.sub{font-size:12px;opacity:.66;margin:0}
.status{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,CanvasText 7%,transparent)}
.top-actions{display:flex;align-items:center;gap:7px}
.expandbtn{width:auto;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);background:transparent;color:CanvasText;padding:5px 8px;border-radius:8px;font-size:11px;font-weight:650;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:#999}
.status.ok .dot{background:#22a06b}.status.bad .dot{background:#d1242f}
.setup-scroll{max-height:520px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;margin-top:14px}
body.fullscreen .setup-scroll{max-height:none;overflow:visible}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px}
.step{font-size:11px;text-align:center;padding:7px 5px;border-radius:8px;background:color-mix(in srgb,CanvasText 6%,transparent);opacity:.58}
.step.active{opacity:1;font-weight:700;background:color-mix(in srgb,CanvasText 11%,transparent)}
.panel{border:1px solid color-mix(in srgb,CanvasText 10%,transparent);border-radius:12px;padding:13px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.labelrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
label{font-size:12px;font-weight:650}.required{opacity:.65}
.linkbtn{width:auto!important;border:0!important;background:transparent!important;color:CanvasText!important;padding:2px 0!important;margin:0!important;font-size:11px!important;font-weight:650!important;text-decoration:underline;text-underline-offset:2px}
input,select,button{font:inherit;border-radius:9px}
input,select{width:100%;padding:9px 10px;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);background:Canvas;color:CanvasText}
button{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);padding:9px 11px;cursor:pointer;font-weight:650}
button.primary{background:#111;color:#fff;border-color:#111}
button.secondary{background:transparent;color:CanvasText}
button:disabled{opacity:.42;cursor:not-allowed}
.createbox{margin-top:7px;padding:9px;border-radius:9px;background:color-mix(in srgb,CanvasText 5%,transparent)}
.createbox .row{display:grid;grid-template-columns:1fr auto;gap:7px}
.createbox button{margin:0}
.msg{font-size:11px;min-height:15px;margin-top:5px;opacity:.72}
.aws{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:11px 12px;border-radius:11px;border:1px solid color-mix(in srgb,CanvasText 10%,transparent)}
.aws-title{font-size:12px;font-weight:700}.aws-sub{font-size:11px;opacity:.65;margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;font-size:10px;background:color-mix(in srgb,CanvasText 7%,transparent);white-space:nowrap}
.actions{display:flex;justify-content:flex-end;margin-top:10px}
.actions button{font-size:11px;padding:7px 9px}
.hidden{display:none!important}
@media(max-width:480px){.top{display:block}.top-actions{margin-top:8px}.status{display:inline-flex}.createbox .row{grid-template-columns:1fr}.aws{align-items:flex-start;flex-direction:column}.aws button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top">
      <div>
        <h1>Vodia Setup</h1>
        <p class="sub">Only required information is shown. IDs stay in the background.</p>
      </div>
      <div class="top-actions">
        <button id="expandBtn" class="expandbtn" type="button" hidden>Expand</button>
        <div id="authStatus" class="status"><span class="dot"></span><span>Connecting…</span></div>
      </div>
    </div>

    <div id="setupScroll" class="setup-scroll">
      <div class="steps" aria-label="Setup steps">
        <div class="step active">1 · Customer</div>
        <div class="step">2 · AWS</div>
        <div class="step">3 · Deploy</div>
      </div>

      <div class="panel">
        <div class="field">
          <div class="labelrow">
            <label for="orgSelect">Organization <span class="required">*</span></label>
            <button id="toggleOrg" class="linkbtn" type="button">+ New organization</button>
          </div>
          <select id="orgSelect" required><option value="">Loading…</option></select>
          <div id="newOrg" class="createbox hidden">
            <div class="row">
              <input id="orgName" maxlength="160" placeholder="Organization name" autocomplete="organization">
              <button id="createOrg" class="primary" type="button">Create</button>
            </div>
            <div id="orgMsg" class="msg"></div>
          </div>
        </div>

        <div class="field">
          <div class="labelrow">
            <label for="customerSelect">Customer <span class="required">*</span></label>
            <button id="toggleCustomer" class="linkbtn" type="button">+ New customer</button>
          </div>
          <select id="customerSelect" required disabled><option value="">Select organization first</option></select>
          <div id="newCustomer" class="createbox hidden">
            <div class="row">
              <input id="customerName" maxlength="160" placeholder="Customer name" autocomplete="organization">
              <button id="createCustomer" class="primary" type="button">Create</button>
            </div>
            <div id="customerMsg" class="msg"></div>
          </div>
        </div>
      </div>

      <div class="aws">
        <div>
          <div class="aws-title">AWS connection <span class="required">*</span></div>
          <div id="awsMsg" class="aws-sub">Select a customer to check its connection.</div>
        </div>
        <div style="display:flex;gap:7px;align-items:center">
          <span id="awsBadge" class="badge">Waiting</span>
          <button id="checkAws" class="secondary" type="button" disabled>Check</button>
        </div>
      </div>

      <div class="actions">
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  let rpcId = 1;
  const pending = new Map();
  let initialized = false;
  let hostContext = {
    displayMode: "inline",
    availableDisplayModes: [],
    theme: null
  };
  let allCustomers = [];
  let inlineScrollTop = 0;
  let fullscreenScrollTop = 0;

  const $ = (id) => document.getElementById(id);
  const orgId = () => $("orgSelect").value;
  const customerId = () => $("customerSelect").value;
  const setMsg = (id,text) => { $(id).textContent=text||""; };

  function post(msg){ window.parent.postMessage(msg, "*"); }

  let resizeTimer = null;
  function reportSize(){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const width=Math.ceil(document.body.scrollWidth);
      const height=Math.ceil(document.body.scrollHeight);
      post({
        jsonrpc:"2.0",
        method:"ui/notifications/size-changed",
        params:{width,height}
      });
    },40);
  }

  function applyHostContext(update={}){
    hostContext={...hostContext,...update};
    const mode=hostContext.displayMode||"inline";
    const fullscreen=mode==="fullscreen";
    const canFullscreen=Array.isArray(hostContext.availableDisplayModes)
      && hostContext.availableDisplayModes.includes("fullscreen");

    document.body.classList.toggle("fullscreen",fullscreen);
    document.documentElement.dataset.displayMode=mode;

    const btn=$("expandBtn");
    btn.hidden=!canFullscreen;
    btn.textContent=fullscreen?"Collapse":"Expand";

    if(hostContext.theme==="light" || hostContext.theme==="dark"){
      document.documentElement.style.colorScheme=hostContext.theme;
    }

    requestAnimationFrame(()=>{
      if(fullscreen){
        window.scrollTo({top:inlineScrollTop,left:0,behavior:"auto"});
      }else{
        $("setupScroll").scrollTop=Math.max(0,fullscreenScrollTop||inlineScrollTop);
      }
      reportSize();
    });
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;

    if (m.id && pending.has(m.id)) {
      const {resolve,reject}=pending.get(m.id);
      pending.delete(m.id);
      if (m.error) reject(new Error(m.error.message || "Host request failed"));
      else resolve(m.result);
      return;
    }

    if(m.method==="ui/notifications/host-context-changed"){
      applyHostContext(m.params||{});
    }
  });

  function request(method, params={}) {
    const id=rpcId++;
    post({jsonrpc:"2.0",id,method,params});
    return new Promise((resolve,reject)=>{
      pending.set(id,{resolve,reject});
      setTimeout(()=>{
        if(pending.has(id)){pending.delete(id);reject(new Error("Host request timed out"))}
      },15000);
    });
  }

  async function requestDisplayMode(mode){
    const current=hostContext.displayMode||"inline";
    if(mode==="fullscreen"){
      inlineScrollTop=$("setupScroll").scrollTop;
    }else if(current==="fullscreen"){
      fullscreenScrollTop=window.scrollY;
    }

    try{
      let result;
      if(window.openai?.requestDisplayMode){
        result=await window.openai.requestDisplayMode({mode});
      }else{
        result=await request("ui/request-display-mode",{mode});
      }
      applyHostContext({displayMode:result?.mode||current});
      return result?.mode||current;
    }catch(_e){
      applyHostContext({displayMode:current});
      return current;
    }
  }

  async function initBridge(){
    if (window.openai?.callTool) {
      applyHostContext({
        displayMode:window.openai.displayMode||"inline",
        availableDisplayModes:Array.isArray(window.openai.availableDisplayModes)
          ? window.openai.availableDisplayModes
          : [],
        theme:window.openai.theme||null
      });
      return;
    }

    const initResult=await request("ui/initialize",{
      protocolVersion:"2026-01-26",
      appInfo:{name:"vodia-setup",version:"1.4.0"},
      appCapabilities:{availableDisplayModes:["inline","fullscreen"]}
    });
    post({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}});
    initialized=true;
    applyHostContext(initResult?.hostContext||{});
  }

  async function callTool(name,args={}){
    if(window.openai?.callTool) return window.openai.callTool(name,args);
    if(!initialized) await initBridge();
    return request("tools/call",{name,arguments:args});
  }

  function dataFrom(result){
    const sc=result?.structuredContent;
    if(sc?.data && typeof sc.data==="object") return sc.data;
    if(sc?.result && typeof sc.result==="object") return sc.result;
    if(sc && typeof sc==="object") return sc;
    const text=(result?.content||[]).find(x=>x?.type==="text")?.text;
    if(text){try{return JSON.parse(text)}catch{}}
    return result||{};
  }

  function setStatus(ok,text){
    $("authStatus").className="status "+(ok?"ok":"bad");
    $("authStatus").querySelector("span:last-child").textContent=text;
  }

  function renderCustomers(preselect){
    const sel=$("customerSelect");
    const organizationId=orgId();
    const rows=allCustomers.filter(c=>c.organizationId===organizationId);
    sel.disabled=!organizationId;
    sel.innerHTML=organizationId?'<option value="">Select customer…</option>':'<option value="">Select organization first</option>';
    rows.forEach(c=>{
      const op=document.createElement("option");
      op.value=c.id;
      op.textContent=c.name;
      sel.appendChild(op);
    });
    if(preselect && rows.some(c=>c.id===preselect)) sel.value=preselect;
    else if(rows.length===1) sel.value=rows[0].id;
    onCustomerChanged();
    reportSize();
  }

  async function refreshIdentity(){
    const r=dataFrom(await callTool("msp_get_my_identity",{}));
    const ident=r.identity||{};
    setStatus(Boolean(ident.authenticated),ident.authenticated?"OAuth connected":"OAuth required");
  }

  async function refreshOrganizations(preselect){
    const r=dataFrom(await callTool("msp_list_organizations",{}));
    const rows=r.organizations||[];
    const sel=$("orgSelect");
    const keep=preselect||sel.value;
    sel.innerHTML='<option value="">Select organization…</option>';
    rows.forEach(o=>{
      const op=document.createElement("option");
      op.value=o.id; op.textContent=o.name;
      sel.appendChild(op);
    });
    if(keep && rows.some(o=>o.id===keep)) sel.value=keep;
    else if(rows.length===1) sel.value=rows[0].id;
  }

  async function refreshCustomers(preselect){
    const r=dataFrom(await callTool("msp_list_customers",{}));
    allCustomers=r.customers||[];
    renderCustomers(preselect);
  }

  function resetAws(){
    $("awsBadge").textContent=customerId()?"Not checked":"Waiting";
    setMsg("awsMsg",customerId()?"AWS is required before deployment.":"Select a customer to check its connection.");
    $("checkAws").disabled=!customerId();
  }

  function onCustomerChanged(){ resetAws(); }

  async function refreshAll(){
    setMsg("orgMsg",""); setMsg("customerMsg","");
    await refreshIdentity();
    await refreshOrganizations();
    await refreshCustomers();
  }

  $("toggleOrg").addEventListener("click",()=>{
    $("newOrg").classList.toggle("hidden");
    if(!$("newOrg").classList.contains("hidden")) $("orgName").focus();
    reportSize();
  });

  $("toggleCustomer").addEventListener("click",()=>{
    if(!orgId()){ setMsg("customerMsg","Select an organization first."); return; }
    $("newCustomer").classList.toggle("hidden");
    if(!$("newCustomer").classList.contains("hidden")) $("customerName").focus();
    reportSize();
  });

  $("orgSelect").addEventListener("change",()=>{
    renderCustomers();
    $("newCustomer").classList.add("hidden");
    reportSize();
  });

  $("customerSelect").addEventListener("change",()=>{
    onCustomerChanged();
    reportSize();
  });

  $("createOrg").addEventListener("click",async()=>{
    const name=$("orgName").value.trim();
    if(name.length<2){setMsg("orgMsg","Enter an organization name.");return}
    try{
      setMsg("orgMsg","Creating…");
      const r=dataFrom(await callTool("msp_create_organization",{name}));
      const id=r.organization?.id;
      $("orgName").value="";
      $("newOrg").classList.add("hidden");
      await refreshOrganizations(id);
      await refreshCustomers();
      reportSize();
    }catch(e){setMsg("orgMsg",e.message);reportSize()}
  });

  $("createCustomer").addEventListener("click",async()=>{
    const organizationId=orgId();
    const name=$("customerName").value.trim();
    if(!organizationId){setMsg("customerMsg","Select an organization first.");return}
    if(name.length<2){setMsg("customerMsg","Enter a customer name.");return}
    try{
      setMsg("customerMsg","Creating…");
      const r=dataFrom(await callTool("msp_create_customer",{organizationId,name}));
      const id=r.customer?.id;
      $("customerName").value="";
      $("newCustomer").classList.add("hidden");
      await refreshOrganizations(organizationId);
      await refreshCustomers(id);
      reportSize();
    }catch(e){setMsg("customerMsg",e.message);reportSize()}
  });

  $("checkAws").addEventListener("click",async()=>{
    const id=customerId();
    if(!id) return;
    try{
      $("awsBadge").textContent="Checking…";
      setMsg("awsMsg","Checking saved AWS connection…");
      const r=dataFrom(await callTool("msp_get_customer_aws_connection",{customerId:id}));
      const c=r.connection;
      if(c?.configured){
        $("awsBadge").textContent="Connected";
        setMsg("awsMsg","AWS account "+(c.account||"")+" is ready.");
      }else{
        $("awsBadge").textContent="Required";
        setMsg("awsMsg","No AWS connection is configured for this customer.");
      }
    }catch(e){
      $("awsBadge").textContent="Error";
      setMsg("awsMsg",e.message);
    }
    reportSize();
  });

  $("expandBtn").addEventListener("click",async()=>{
    const canFullscreen=Array.isArray(hostContext.availableDisplayModes)
      && hostContext.availableDisplayModes.includes("fullscreen");
    if(!canFullscreen) return;
    const next=hostContext.displayMode==="fullscreen"?"inline":"fullscreen";
    await requestDisplayMode(next);
  });

  $("refresh").addEventListener("click",()=>refreshAll().catch(e=>setStatus(false,e.message)));

  if("ResizeObserver" in window){
    const ro=new ResizeObserver(()=>reportSize());
    ro.observe(document.body);
  }

  window.addEventListener("load",reportSize);
  window.addEventListener("resize",reportSize);

  (async()=>{
    try{
      await initBridge();
      await refreshAll();
      reportSize();
    }catch(e){
      setStatus(false,e.message);
      reportSize();
    }
  })();
})();
</script>
</body>
</html>
